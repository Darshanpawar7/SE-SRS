name: Dependency Security Audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Audit the committed lockfile, including development dependencies.
      # The exit code is intentionally not masked, including registry failures.
      - name: Block on high and critical dependency findings
        run: npm run audit:security
